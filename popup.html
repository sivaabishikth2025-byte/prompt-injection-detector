<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Prompt Injection Detector</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .sparkline-wrap { padding: 6px 0 2px; }
    canvas#risk-sparkline { display:block; width:100%; height:36px; border-radius:6px; }
    .spark-label { font-size:10px; color:#94a3b8; text-align:right; margin-top:2px; }
    .injection-badge { display:inline-flex; align-items:center; gap:4px; background:#fee2e2; color:#991b1b; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; }
    .proxy-badge { display:inline-flex; align-items:center; gap:4px; background:#dcfce7; color:#166534; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; }
    .badge-row { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
  </style>
</head>
<body class="popup-body">
  <main class="panel">
    <header class="panel-head">
      <div>
        <div class="title">🛡️ Prompt Injection Detector</div>
        <div class="subtitle">Local prompt-injection &amp; privacy guard</div>
      </div>
      <label class="switch">
        <input id="enabled-toggle" type="checkbox"/>
        <span>ON</span>
      </label>
    </header>

    <section class="card">
      <div class="row"><span>Policy pack</span><strong id="policy-pack">-</strong></div>
      <div class="row"><span>Auto redact</span><strong id="auto-threshold">-</strong></div>
      <div class="row"><span>Block</span><strong id="block-threshold">-</strong></div>
      <div class="row">
        <span>Proxy chain</span>
        <strong id="proxy-status-label">-</strong>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <span>Ledger integrity</span>
        <strong id="ledger-integrity">Checking…</strong>
      </div>
    </section>

    <section class="card">
      <div class="row row-tight"><strong>Risk timeline</strong><span class="spark-label" id="spark-range"></span></div>
      <div class="sparkline-wrap">
        <canvas id="risk-sparkline" height="36"></canvas>
      </div>
    </section>

    <section class="card">
      <div class="row row-tight">
        <strong>Latest events</strong>
        <button id="refresh-btn" class="btn btn-ghost">Refresh</button>
      </div>
      <ul id="events" class="events-list"></ul>
    </section>

    <footer class="actions">
      <button id="open-options" class="btn">Options</button>
      <button id="clear-ledger" class="btn btn-danger">Clear</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
